name: Cloud PC (Windows App + Serveo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Instalar Firefox e Ferramentas
        shell: powershell
        run: |
          Write-Host "Baixando e instalando Firefox..."
          winget install Mozilla.Firefox --silent --accept-package-agreements --accept-source-agreements

      - name: Configurar RDP e Firewall
        shell: powershell
        run: |
          Write-Host "Habilitando RDP nativo..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          
          Write-Host "Definindo senha da máquina..."
          net user runneradmin CloudGaming2026#

      - name: Iniciar Túnel TCP com Serveo
        shell: powershell
        run: |
          Write-Host "Abrindo túnel TCP gratuito..."
          # Dispara o túnel SSH em segundo plano salvando os logs
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net" -RedirectStandardOutput "serveo.txt" -RedirectStandardError "serveo_err.txt" -NoNewWindow
          
          Write-Host "Aguardando o túnel estabilizar (10 segundos)..."
          Start-Sleep -Seconds 10
          
          if (Test-Path "serveo.txt") {
              $content = Get-Content "serveo.txt" -Raw
              Write-Host "--- LOGS DO TÚNEL ---"
              Write-Host $content
              Write-Host "---------------------"
          }
          if (Test-Path "serveo_err.txt") {
              $errContent = Get-Content "serveo_err.txt" -Raw
              Write-Host "--- ERROS / CONEXÃO ---"
              Write-Host $errContent
              Write-Host "------------------------"
          }

      - name: Manter Máquina Ligada
        shell: powershell
        run: |
          Write-Host "Servidor online via Serveo."
          while ($true) { Start-Sleep -Seconds 30 }
          
