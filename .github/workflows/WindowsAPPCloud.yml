name: Cloud PC (Windows App)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Instalar Firefox e Ferramentas
        shell: powershell
        run: |
          Write-Host "Baixando e instalando Firefox..."
          winget install Mozilla.Firefox --silent --accept-package-agreements --accept-source-agreements

      - name: Configurar RDP e Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          net user runneradmin CloudGaming2026#

      - name: Iniciar Cloudflare Tunnel
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389" -RedirectStandardError "cloudflared.log" -NoNewWindow
          
          Start-Sleep -Seconds 10
          $log = Get-Content "cloudflared.log" -Raw
          if ($log -match "https://[a-zA-Z0-9-]+\.trycloudflare\.com") {
              $url = $Matches[0] -replace "https://", ""
              Write-Host "===================================================="
              Write-Host "   ENDEREÇO CLOUDFLARE: $url"
              Write-Host "===================================================="
          } else {
              Get-Content "cloudflared.log"
          }
          
      - name: Manter Máquina Ligada
        shell: powershell
        run: |
          Write-Host "Servidor online via Serveo."
          while ($true) { Start-Sleep -Seconds 30 }
          
