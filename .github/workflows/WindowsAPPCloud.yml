name: Cloud PC (Windows App)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Instalar Firefox e Ferramentas
        shell: powershell
        run: |
          Write-Host "Baixando e instalando Firefox..."
          winget install Mozilla.Firefox --silent --accept-package-agreements --accept-source-agreements

      - name: Configurar RDP e Firewall
        shell: powershell
        run: |
          Write-Host "Habilitando RDP nativo..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          
          Write-Host "Definindo senha da máquina..."
          net user runneradmin CloudGaming2026#

      - name: Iniciar Túnel TCP com Bore
        shell: powershell
        run: |
          Write-Host "Baixando Bore..."
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
          Expand-Archive -Path "bore.zip" -DestinationPath "."
          
          Write-Host "Abrindo túnel TCP na porta 3389..."
          Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "bore_out.txt" -RedirectStandardError "bore_err.txt" -NoNewWindow
          
          Write-Host "Aguardando o túnel estabilizar (8 segundos)..."
          Start-Sleep -Seconds 8
          
          Write-Host "=== ENDEREÇO DO TÚNEL BORE ==="
          if (Test-Path "bore_out.txt") { Get-Content "bore_out.txt" }
          if (Test-Path "bore_err.txt") { Get-Content "bore_err.txt" }
          
      - name: Manter Máquina Ligada
        shell: powershell
        run: |
          Write-Host "Servidor online via Serveo."
          while ($true) { Start-Sleep -Seconds 30 }
          
