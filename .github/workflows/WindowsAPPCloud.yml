name: Cloud PC (Windows App)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Instalar Firefox e Ferramentas
        shell: powershell
        run: |
          Write-Host "Baixando e instalando Firefox..."
          winget install Mozilla.Firefox --silent --accept-package-agreements --accept-source-agreements

      - name: Iniciar Túnel TCP com Bore (IP Direto)
        shell: powershell
        run: |
          Write-Host "Baixando Bore..."
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
          Expand-Archive -Path "bore.zip" -DestinationPath "."
          
          Write-Host "Abrindo túnel TCP..."
          Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "bore_out.txt" -RedirectStandardError "bore_err.txt" -NoNewWindow
          
          Write-Host "Aguardando o túnel estabilizar..."
          Start-Sleep -Seconds 8
          
          # Abre o arquivo em modo de compartilhamento de leitura para evitar bloqueio do processo
          $fileStream = [System.IO.File]::Open("$PWD/bore_out.txt", [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
          $streamReader = New-Object System.IO.StreamReader($fileStream)
          $output = $streamReader.ReadToEnd()
          $streamReader.Close()
          $fileStream.Close()

          if ($output -match "remote_port=(\d+)") {
              $port = $Matches[1]
              $ip = [System.Net.Dns]::GetHostAddresses("bore.pub")[0].IPAddressToString
              Write-Host "===================================================="
              Write-Host "   COPIE ESTE IP E PORTA PARA O WINDOWS APP:        "
              Write-Host "   $ip`:$port"
              Write-Host "===================================================="
          } else {
              Write-Host "Conteúdo do log lido:"
              Write-Host $output
          }

      - name: Manter Máquina Ligada
        shell: powershell
        run: |
          Write-Host "Servidor online via Serveo."
          while ($true) { Start-Sleep -Seconds 30 }
          
