name: Cloud PC (Windows App)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Instalar Firefox e Ferramentas
        shell: powershell
        run: |
          Write-Host "Baixando e instalando Firefox..."
          winget install Mozilla.Firefox --silent --accept-package-agreements --accept-source-agreements

      - name: Configurar RDP e Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin CloudGaming2026#

      - name: Iniciar Web-RDP no Navegador (SocketXP)
        shell: powershell
        run: |
          Write-Host "Baixando servidor Web-RDP..."
          Invoke-WebRequest -Uri "https://github.com/socketxp-com/socketxp-client/releases/download/v1.0.0/socketxp-windows-amd64.zip" -OutFile "socketxp.zip"
          Expand-Archive -Path "socketxp.zip" -DestinationPath "."
          
          Write-Host "Iniciando túnel Web..."
          Start-Process -FilePath ".\socketxp.exe" -ArgumentList "connect http://localhost:3389" -RedirectStandardOutput "web_out.txt" -RedirectStandardError "web_err.txt" -NoNewWindow
          
          Start-Sleep -Seconds 8
          Get-Content "web_out.txt"
          Get-Content "web_err.txt"

          
      - name: Manter Máquina Ligada
        shell: powershell
        run: |
          Write-Host "Servidor online via Serveo."
          while ($true) { Start-Sleep -Seconds 30 }
          
