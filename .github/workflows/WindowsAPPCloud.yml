name: Cloud PC (Windows App + Firefox + Extreme Perf)

on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: 'AuthToken NGROK'
        required: true
        default: ''

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Otimização Absolutamente Extrema (Debloat)
        shell: powershell
        run: |
          Write-Host "Iniciando otimização extrema do Windows..."
          
          # 1. Desativar Efeitos Visuais (Foco em Performance)
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name 'VisualFXSetting' -Value 2
          
          # 2. Desativar Serviços Inúteis (Um por um para não dar erro)
          $services = "Spooler", "WSearch", "SysMain", "DiagTrack"
          foreach ($srv in $services) {
              Stop-Service -Name $srv -Force -ErrorAction SilentlyContinue
              Set-Service -Name $srv -StartupType Disabled -ErrorAction SilentlyContinue
          }
          
          # 3. Forçar Plano de Energia de Alto Desempenho
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          
          # 4. Ajustar prioridade de CPU para Programas em Primeiro Plano
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\PriorityControl" -Name "Win32PrioritySeparation" -Value 38
          
          Write-Host "Otimização concluída. RAM e CPU liberadas!"

      - name: Instalar Firefox
        shell: powershell
        run: |
          Write-Host "Baixando Firefox..."
          winget install Mozilla.Firefox --silent --accept-package-agreements --accept-source-agreements

      - name: Configurar RDP (Windows App) e Firewall
        shell: powershell
        run: |
          Write-Host "Habilitando RDP nativo..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          
          Write-Host "Definindo senha da máquina..."
          net user runneradmin CloudGaming2026#

      - name: Baixar, Iniciar Túnel e Obter Endereço
        shell: powershell
        run: |
          Write-Host "Baixando Ngrok..."
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "."
          
          $token = "${{ github.event.inputs.ngrok_token }}"
          .\ngrok.exe config add-authtoken $token
          
          Write-Host "Iniciando túnel TCP na porta 3389..."
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
          
          Write-Host "Aguardando o túnel estabilizar (15 segundos)..."
          Start-Sleep -Seconds 15
          
          # Tentativa de puxar a URL com repetição caso demore
          $publicUrl = ""
          for ($i=1; $i -le 5; $i++) {
              try {
                  $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
                  $publicUrl = $response.tunnels[0].public_url
                  if ($publicUrl) { break }
              } catch {
                  Write-Host "Tentativa $i: Aguardando a API do Ngrok responder..."
                  Start-Sleep -Seconds 5
              }
          }
          
          if ($publicUrl) {
              $cleanUrl = $publicUrl -replace "tcp://", ""
              Write-Host "===================================================="
              Write-Host "   MÁQUINA EXTREMA PRONTA PARA O WINDOWS APP!       "
              Write-Host "===================================================="
              Write-Host " ENDEREÇO RDP: $cleanUrl"
              Write-Host " USUÁRIO     : runneradmin"
              Write-Host " SENHA       : CloudGaming2026#"
              Write-Host "===================================================="
          } else {
              Write-Host "Erro Crítico: O Ngrok iniciou mas a API não respondeu."
              exit 1

      - name: Manter Máquina Ligada
        shell: powershell
        run: |
          Write-Host "Servidor online. Fechará automaticamente após o limite de tempo."
          $mins = 350
          for ($i = 1; $i -le $mins; $i++) {
              Start-Sleep -Seconds 60
          }
