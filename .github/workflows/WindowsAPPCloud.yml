name: Cloud PC (Windows App)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Instalar Firefox e Ferramentas
        shell: powershell
        run: |
          Write-Host "Baixando e instalando Firefox..."
          winget install Mozilla.Firefox --silent --accept-package-agreements --accept-source-agreements

      - name: Configurar RDP e Firewall
        shell: powershell
        run: |
          Write-Host "Habilitando RDP nativo..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          
          Write-Host "Definindo senha da máquina..."
          net user runneradmin CloudGaming2026#

      - name: Iniciar Túnel TCP com Pinggy
        shell: powershell
        run: |
          Write-Host "Abrindo túnel TCP gratuito com Pinggy..."
          Start-Process -FilePath "ssh" -ArgumentList "-p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -T -N -R 0:localhost:3389 tcp@free.pinggy.io" -RedirectStandardOutput "pinggy_out.txt" -RedirectStandardError "pinggy_err.txt" -NoNewWindow
          
          Write-Host "Aguardando o túnel estabilizar (12 segundos)..."
          Start-Sleep -Seconds 12
          
          Write-Host "--- ENDEREÇO DO TÚNEL PINGGY ---"
          if (Test-Path "pinggy_out.txt") {
              Get-Content "pinggy_out.txt"
          }
          if (Test-Path "pinggy_err.txt") {
              Get-Content "pinggy_err.txt"
          }
          
      - name: Manter Máquina Ligada
        shell: powershell
        run: |
          Write-Host "Servidor online via Serveo."
          while ($true) { Start-Sleep -Seconds 30 }
          
