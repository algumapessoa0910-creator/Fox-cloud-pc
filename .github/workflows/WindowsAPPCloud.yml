name: Cloud PC (Windows App + Firefox + Ngrok)

on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: 'AuthToken NGROK'
        required: true
        default: ''

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Instalar Firefox e Ferramentas
        shell: powershell
        run: |
          Write-Host "Baixando e instalando Firefox..."
          winget install Mozilla.Firefox --silent --accept-package-agreements --accept-source-agreements

      - name: Configurar RDP e Firewall
        shell: powershell
        run: |
          Write-Host "Habilitando RDP nativo..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          
          Write-Host "Definindo senha da máquina..."
          net user runneradmin CloudGaming2026#

      - name: Baixar, Iniciar Túnel Ngrok e Obter Endereço
        shell: powershell
        run: |
          Write-Host "Baixando Ngrok..."
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "."
          
          $token = "${{ github.event.inputs.ngrok_token }}"
          .\ngrok.exe config add-authtoken $token
          
          Write-Host "Iniciando túnel TCP na porta 3389..."
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
          
          Write-Host "Aguardando o túnel estabilizar (10 segundos)..."
          Start-Sleep -Seconds 10
          
          $publicUrl = ""
          for ($index = 1; $index -le 5; $index++) {
              try {
                  $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
                  $publicUrl = $response.tunnels[0].public_url
                  if ($publicUrl) { break }
              } catch {
                  Write-Host "Tentativa $index de 5 - Aguardando a API do Ngrok responder..."
                  Start-Sleep -Seconds 5
              }
          }
          
          if ($publicUrl) {
              $cleanUrl = $publicUrl -replace "tcp://", ""
              Write-Host "===================================================="
              Write-Host "   MÁQUINA EXTREMA PRONTA PARA O WINDOWS APP!       "
              Write-Host "===================================================="
              Write-Host " ENDEREÇO RDP: $cleanUrl"
              Write-Host " USUÁRIO     : runneradmin"
              Write-Host " SENHA       : CloudGaming2026#"
              Write-Host "===================================================="
          } else {
              Write-Host "Erro Crítico: O Ngrok iniciou mas a API não respondeu."
              exit 1
          }

      - name: Manter Máquina Ligada
        shell: powershell
        run: |
          Write-Host "Servidor online. Fechará automaticamente após o limite de tempo."
          while ($true) { Start-Sleep -Seconds 30 }
          
