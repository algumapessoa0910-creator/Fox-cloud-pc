name: Cloud PC (Windows App + Serveo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Instalar Firefox e Ferramentas
        shell: powershell
        run: |
          Write-Host "Baixando e instalando Firefox..."
          winget install Mozilla.Firefox --silent --accept-package-agreements --accept-source-agreements

      - name: Configurar RDP e Firewall
        shell: powershell
        run: |
          Write-Host "Habilitando RDP nativo..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          
          Write-Host "Definindo senha da máquina..."
          net user runneradmin CloudGaming2026#

      - name: Iniciar Túnel TCP com Localhost.run
        shell: powershell
        run: |
          Write-Host "Abrindo túnel TCP gratuito com Localhost.run..."
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -T -N -R 0:localhost:3389 localhost.run" -RedirectStandardOutput "tunnel.txt" -RedirectStandardError "tunnel_err.txt" -NoNewWindow
          
          Write-Host "Aguardando o túnel estabilizar (12 segundos)..."
          Start-Sleep -Seconds 12
          
          Write-Host "--- RESULTADO DO TÚNEL ---"
          if (Test-Path "tunnel_err.txt") {
              Get-Content "tunnel_err.txt"
          }
          if (Test-Path "tunnel.txt") {
              Get-Content "tunnel.txt"
          }
          
      - name: Manter Máquina Ligada
        shell: powershell
        run: |
          Write-Host "Servidor online via Serveo."
          while ($true) { Start-Sleep -Seconds 30 }
          
