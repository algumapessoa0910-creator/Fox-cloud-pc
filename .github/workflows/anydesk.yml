name: AnyDesk Linux Ultra-Optimized + Wine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANYDESK_PASS: Pass@1234

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ultra-Light GUI (LXDE), Wine & 3D Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          
          # Instala LXDE, AnyDesk/X11 deps e ambiente WINE/Mesa para rodar jogos .exe
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            lxde-core openbox xvfb wget gnupg2 curl x11vnc \
            mesa-utils libgl1-mesa-dri libglx-mesa0 libgl1 \
            dbus-x11 python3-xdg \
            wine64 wine32 winetricks cabextract p7zip-full

      - name: Install AnyDesk
        run: |
          wget -qO - https://keys.anydesk.com/repos/DEB-GPG-KEY | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/anydesk.gpg
          echo "deb http://deb.anydesk.com/ all main" | sudo tee /etc/apt/sources.list.d/anydesk.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y anydesk
          
      - name: Start Display & AnyDesk Service
        run: |
          # 1. Inicia o D-Bus necessário para comunicação do AnyDesk
          sudo service dbus start
          
          # 2. Sobe a tela virtual X11 com resolução HD
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
          sleep 2

          # 3. Inicia o gerenciador de janelas
          dbus-launch openbox-session &
          sleep 2

          # 4. Inicia o AnyDesk atrelado explicitamente ao servidor X11
          echo "${{ env.ANYDESK_PASS }}" | sudo anydesk --set-password
          DISPLAY=:99 anydesk --tray &
          sleep 5

      - name: Fetch and Display AnyDesk Connection Address
        run: |
          cleanId=""
          for i in {1..20}; do
              cleanId=$(sudo anydesk --get-id 2>/dev/null | tr -d '\n\r' || true)
              if [[ -z "$cleanId" || ! "$cleanId" =~ ^[0-9]+$ ]]; then
                  if [ -f /etc/anydesk/system.conf ]; then
                      cleanId=$(grep 'ad.anynet.id=' /etc/anydesk/system.conf | cut -d'=' -f2 | tr -d '\n\r' || true)
                  fi
              fi
              if [[ -n "$cleanId" && "$cleanId" =~ ^[0-9]+$ ]]; then
                  break
              fi
              sleep 3
          done

          GREEN="\033[32m"
          YELLOW="\033[33m"
          RED="\033[31m"
          RESET="\033[0m"

          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${GREEN}        ANYDESK EXTREME OPTIMIZED IS READY          ${RESET}"
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${YELLOW} CONNECTION ID : ${RED}${cleanId}${RESET}"
          echo -e "${YELLOW} PASSWORD      : ${RED}${ANYDESK_PASS}${RESET}"
          echo -e "${GREEN}====================================================${RESET}"

      - name: Keep alive
        run: |
          mins=350
          echo "Ativo por $mins minutos."
          for i in $(seq 1 $mins); do
            sleep 60
          done
          
