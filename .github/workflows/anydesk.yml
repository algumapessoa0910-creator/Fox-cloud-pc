name: AnyDesk Linux Ultra-Optimized

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANYDESK_PASS: Pass@1234
      RUNTIME_MINUTES: 350

    steps:
      - name: Purge Bloatware & Optimize Kernel (Max Performance)
        run: |
          echo "Desativando serviços pesados e de nuvem..."
          sudo systemctl stop snapd unattended-upgrades
          sudo apt-get purge -y snapd unattended-upgrades multipath-tools
          
          echo "Otimizando rede para baixa latência no AnyDesk..."
          sudo sysctl -w net.ipv4.tcp_low_latency=1
          sudo sysctl -w net.ipv4.tcp_fastopen=3
          sudo sysctl -w vm.swappiness=10
          
      - name: Install Ultra-Light GUI (LXDE) & 3D Software Rendering
        run: |
          sudo apt-get update
          
          # Instala o núcleo mínimo do LXDE, Xvfb e bibliotecas de aceleração 3D emulada
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            lxde-core openbox xvfb wget gnupg2 curl x11vnc \
            mesa-utils libgl1-mesa-dri libglx-mesa0 libgl1-mesa-glx
            
      - name: Install AnyDesk
        run: |
          wget -qO - https://keys.anydesk.com/repos/DEB-GPG-KEY | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/anydesk.gpg
          echo "deb http://deb.anydesk.com/ all main" | sudo tee /etc/apt/sources.list.d/anydesk-stable.list
          sudo apt-get update
          sudo apt-get install -y anydesk

      - name: Start Display & AnyDesk (Optimized Resolution)
        run: |
          # Resolução HD (720p) para exigir menos da CPU e acelerar a transmissão da imagem
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
          
          # Inicia o LXDE (Interface minimalista)
          export DISPLAY=:99
          startlxde &
          
          # Inicia o serviço
          sudo service anydesk start
          sleep 3
          
          # Define a senha
          echo "${{ env.ANYDESK_PASS }}" | sudo anydesk --set-password
          sudo service anydesk restart
          sleep 3

      - name: Fetch and Display AnyDesk Connection Address
        run: |
          cleanId=""
          for i in {1..10}; do
              if command -v anydesk &> /dev/null; then
                  cleanId=$(anydesk --get-id 2>/dev/null || true)
                  if [[ -n "$cleanId" ]]; then
                      break
                  fi
              fi
              sleep 4
          done
          
          GREEN="\033[32m"
          YELLOW="\033[33m"
          RED="\033[31m"
          RESET="\033[0m"
          
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${GREEN}        ANYDESK EXTREME OPTIMIZED IS READY          ${RESET}"
          echo -e "${GREEN}====================================================${RESET}"
          echo -e "${YELLOW} CONNECTION ID : ${RED}${cleanId}${RESET}"
          echo -e "${YELLOW} PASSWORD      : ${RED}${ANYDESK_PASS}${RESET}"
          echo -e "${GREEN}====================================================${RESET}"

      - name: Keep alive
        run: |
          mins=${{ env.RUNTIME_MINUTES }}
          end_time=$(( $(date +%s) + (mins * 60) ))
          
          while [ $(date +%s) -lt $end_time ]; do
            echo "Cloud Linux PC Heartbeat $(date +%H:%M:%S) | Active until $(date -d "@$end_time" +%H:%M:%S)"
            sleep 60
          done
          
